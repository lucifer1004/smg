"61" fill="#1e293b" class="gs-label" font-size="10" text-anchor="middle">Kubernetes</text><rect width="110" height="28" x="230" y="42" fill="url(#gs-primaryGrad)" rx="8"/><text x="285" y="61" fill="#fff" class="gs-label" font-size="10" text-anchor="middle">SMG Gateway</text><rect width="80" height="28" x="420" y="42" fill="url(#gs-blueGrad)" rx="8"/><text x="460" y="61" fill="#fff" class="gs-label" font-size="10" text-anchor="middle">Clients</text><rect width="80" height="28" x="570" y="42" fill="url(#gs-greenGrad)" rx="8"/><text x="610" y="61" fill="#fff" class="gs-label" font-size="10" text-anchor="middle">Workers</text><line x1="100" x2="100" y1="70" y2="370" stroke="#fbbf24" stroke-dasharray="4 4" stroke-width="1.5" opacity=".4"/><line x1="285" x2="285" y1="70" y2="370" stroke="#8b5cf6" stroke-dasharray="4 4" stroke-width="1.5" opacity=".4"/><line x1="460" x2="460" y1="70" y2="370" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5" opacity=".4"/><line x1="610" x2="610" y1="70" y2="370" stroke="#34d399" stroke-dasharray="4 4" stroke-width="1.5" opacity=".4"/><line x1="100" x2="280" y1="95" y2="95" stroke="#ef4444" stroke-width="2"/><polygon fill="#ef4444" points="277 91 285 95 277 99"/><text x="190" y="89" fill="#f87171" class="gs-msg" font-weight="700" text-anchor="middle">SIGTERM</text><rect width="170" height="18" x="200" y="105" fill="#ef4444" stroke="#ef4444" stroke-width="1" opacity=".15" rx="4"/><text x="285" y="117" fill="#f87171" class="gs-note" text-anchor="middle">1. Stop accepting new requests</text><line x1="460" x2="290" y1="140" y2="140" stroke="#38bdf8" stroke-width="1.5"/><polygon fill="#38bdf8" points="293 136 285 140 293 144"/><text x="375" y="134" fill="#38bdf8" class="gs-msg" text-anchor="middle">New Request</text><line x1="285" x2="455" y1="158" y2="158" stroke="#ef4444" stroke-dasharray="5 3" stroke-width="1.5"/><polygon fill="#ef4444" points="452 154 460 158 452 162"/><text x="370" y="155" fill="#f87171" class="gs-msg" text-anchor="middle">503 Service Unavailable</text><rect width="170" height="18" x="200" y="172" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" opacity=".15" rx="4"/><text x="285" y="184" fill="#fbbf24" class="gs-note" text-anchor="middle">2. Wait for in-flight requests</text><line x1="285" x2="605" y1="200" y2="200" stroke="#34d399" stroke-width="1.5"/><polygon fill="#34d399" points="602 196 610 200 602 204"/><text x="447" y="195" fill="#34d399" class="gs-msg" text-anchor="middle">Continue processing...</text><line x1="610" x2="290" y1="220" y2="220" stroke="#34d399" stroke-dasharray="5 3" stroke-width="1.5"/><polygon fill="#34d399" points="293 216 285 220 293 224"/><text x="447" y="216" fill="#34d399" class="gs-msg" text-anchor="middle">Response</text><line x1="285" x2="455" y1="238" y2="238" stroke="#a78bfa" stroke-dasharray="5 3" stroke-width="1.5"/><polygon fill="#a78bfa" points="452 234 460 238 452 242"/><text x="370" y="234" fill="#a78bfa" class="gs-msg" text-anchor="middle">Response (existing request)</text><rect width="170" height="18" x="200" y="252" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" opacity=".15" rx="4"/><text x="285" y="264" fill="#fbbf24" class="gs-note" text-anchor="middle">3. Grace period timer starts</text><rect width="240" height="75" x="200" y="278" fill="none" stroke="#475569" stroke-dasharray="6 3" stroke-width="1.5" rx="6"/><rect width="40" height="16" x="204" y="278" fill="#475569" opacity=".5" rx="4"/><text x="224" y="290" fill="#94a3b8" class="gs-note" font-weight="600" text-anchor="middle">alt</text><rect width="160" height="18" x="210" y="298" fill="#10b981" stroke="#10b981" stroke-width="1" opacity=".15" rx="4"/><text x="290" y="310" fill="#34d399" class="gs-note" text-anchor="middle">All complete → Clean exit</text><line x1="200" x2="440" y1="322" y2="322" stroke="#475569" stroke-dasharray="4 3" stroke-width="1"/><text x="215" y="320" fill="#94a3b8" class="gs-note" font-size="7">[else]</text><rect width="160" height="18" x="210" y="328" fill="#ef4444" stroke="#ef4444" stroke-width="1" opacity=".15" rx="4"/><text x="290" y="340" fill="#f87171" class="gs-note" text-anchor="middle">Grace period → Force shutdown</text><text x="350" y="390" fill="#64748b" class="gs-sublabel" font-size="11" text-anchor="middle">Zero-Downtime Deployments • In-Flight Request Draining • Configurable Grace Period</text></svg>