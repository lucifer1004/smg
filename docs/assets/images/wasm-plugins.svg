<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><defs><linearGradient id="wp-primaryGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#6366f1" offset="0%"/><stop style="stop-color:#8b5cf6" offset="100%"/></linearGradient><linearGradient id="wp-greenGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#10b981" offset="0%"/><stop style="stop-color:#34d399" offset="100%"/></linearGradient><linearGradient id="wp-blueGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#0ea5e9" offset="0%"/><stop style="stop-color:#38bdf8" offset="100%"/></linearGradient><linearGradient id="wp-amberGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#f59e0b" offset="0%"/><stop style="stop-color:#fbbf24" offset="100%"/></linearGradient><linearGradient id="wp-redGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#ef4444" offset="0%"/><stop style="stop-color:#f87171" offset="100%"/></linearGradient><linearGradient id="wp-purpleGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#8b5cf6" offset="0%"/><stop style="stop-color:#a78bfa" offset="100%"/></linearGradient><linearGradient id="wp-bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#0f172a" offset="0%"/><stop style="stop-color:#1e293b" offset="100%"/></linearGradient><filter id="wp-glow"><feGaussianBlur result="coloredBlur" stdDeviation="2"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="wp-softGlow"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="wp-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-width=".5" d="M 40 0 L 0 0 0 40" opacity=".3"/></pattern><clipPath id="wp-clipFlow1"><rect width="50" height="30" x="125" y="185"/></clipPath><clipPath id="wp-clipFlow2"><rect width="50" height="30" x="615" y="185"/></clipPath><clipPath id="wp-clipFlow3"><rect width="50" height="30" x="730" y="185"/></clipPath></defs><style>@keyframes wp-pulse{0%{opacity:1}50%{opacity:.6}}@keyframes wp-flow{0%{transform:translateX(0);opacity:0}10%,90%{opacity:1}}@keyframes wp-reject{0%{opacity:.4}50%{opacity:1}}.wp-label,.wp-sublabel{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-weight:600}.wp-sublabel{font-weight:500}.wp-feature{font-size:10px;fill:#94a3b8}.wp-action-label,.wp-feature,.wp-layer-label{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.wp-layer-label{font-size:10px;fill:#64748b;text-transform:uppercase;letter-spacing:.5px}.wp-action-label{font-size:9px;font-weight:600}.wp-code{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,monospace;font-size:9px}.wp-packet1{animation:wp-flow .6s linear infinite}.wp-packet2{animation:wp-flow .6s linear infinite .2s}.wp-pulse{animation:wp-pulse 2s ease-in-out infinite}.wp-reject-pulse{animation:wp-reject 1.5s ease-in-out infinite}</style><rect width="900" height="520" fill="url(#wp-bgGrad)" rx="16"/><rect width="900" height="520" fill="url(#wp-grid)" rx="16"/><ellipse cx="70" cy="200" fill="#6366f1" filter="url(#wp-softGlow)" opacity=".08" rx="50" ry="70"/><ellipse cx="400" cy="200" fill="#8b5cf6" filter="url(#wp-softGlow)" opacity=".06" rx="180" ry="120"/><ellipse cx="700" cy="200" fill="#10b981" filter="url(#wp-softGlow)" opacity=".08" rx="60" ry="80"/><ellipse cx="830" cy="200" fill="#f59e0b" filter="url(#wp-softGlow)" opacity=".08" rx="50" ry="70"/><text x="450" y="35" fill="#e2e8f0" class="wp-label" font-size="14" text-anchor="middle">WASM Plugin Middleware Pipeline</text><text x="450" y="52" fill="#64748b" class="wp-feature" text-anchor="middle">Sandboxed • Dynamic • Language Agnostic</text><g class="wp-pulse"><rect width="105" height="100" x="20" y="150" fill="#1e293b" stroke="#6366f1" stroke-width="2" rx="10"/><rect width="105" height="26" x="20" y="150" fill="url(#wp-primaryGrad)" rx="10"/><rect width="105" height="8" x="20" y="168" fill="url(#wp-primaryGrad)"/><text x="72" y="169" fill="#fff" class="wp-label" font-size="11" text-anchor="middle">Request</text><text x="72" y="195" class="wp-feature" text-anchor="middle">POST /v1/chat</text><text x="72" y="212" class="wp-feature" text-anchor="middle">Authorization: ...</text><text x="72" y="229" class="wp-feature" text-anchor="middle">Content-Type: json</text></g><rect width="450" height="250" x="155" y="75" fill="none" stroke="#475569" stroke-dasharray="6 4" stroke-width="1.5" rx="12"/><text x="380" y="95" fill="#64748b" class="wp-layer-label" text-anchor="middle">SMG GATEWAY MIDDLEWARE LAYER</text><rect width="200" height="195" x="170" y="115" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" rx="10"/><rect width="200" height="26" x="170" y="115" fill="url(#wp-purpleGrad)" rx="10"/><rect width="200" height="8" x="170" y="133" fill="url(#wp-purpleGrad)"/><text x="270" y="134" fill="#fff" class="wp-label" font-size="11" text-anchor="middle">OnRequest Plugins</text><rect width="176" height="44" x="182" y="155" fill="#334155" stroke="#10b981" stroke-width="1" rx="6"/><circle cx="198" cy="170" r="8" fill="#10b981" opacity=".2"/><text x="198" y="173" fill="#10b981" class="wp-code" text-anchor="middle">1</text><text x="215" y="171" fill="#e2e8f0" class="wp-sublabel" font-size="10">auth-middleware</text><text x="215" y="186" fill="#94a3b8" class="wp-feature">Validate API keys → 401 on failure</text><rect width="176" height="44" x="182" y="205" fill="#334155" stroke="#0ea5e9" stroke-width="1" rx="6"/><circle cx="198" cy="220" r="8" fill="#0ea5e9" opacity=".2"/><text x="198" y="223" fill="#0ea5e9" class="wp-code" text-anchor="middle">2</text><text x="215" y="221" fill="#e2e8f0" class="wp-sublabel" font-size="10">ratelimit-middleware</text><text x="215" y="236" fill="#94a3b8" class="wp-feature">60 req/min per key → 429 if exceeded</text><rect width="176" height="44" x="182" y="255" fill="#334155" stroke="#f59e0b" stroke-width="1" rx="6"/><circle cx="198" cy="270" r="8" fill="#f59e0b" opacity=".2"/><text x="198" y="273" fill="#f59e0b" class="wp-code" text-anchor="middle">3</text><text x="215" y="271" fill="#e2e8f0" class="wp-sublabel" font-size="10">logging-middleware</text><text x="215" y="286" fill="#94a3b8" class="wp-feature">Add x-request-id, x-wasm-processed</text><rect width="90" height="90" x="390" y="155" fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="8"/><text x="435" y="135" fill="#64748b" class="wp-layer-label" text-anchor="middle">Core</text><text x="435" y="185" fill="#e2e8f0" class="wp-sublabel" font-size="10" text-anchor="middle">Router</text><text x="435" y="200" class="wp-feature" text-anchor="middle">Load Balance</text><text x="435" y="218" fill="#64748b" class="wp-sublabel" font-size="9" text-anchor="middle">↓</text><text x="435" y="232" fill="#e2e8f0" class="wp-sublabel" font-size="10" text-anchor="middle">Worker</text><rect width="90" height="90" x="500" y="155" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" rx="10"/><text x="545" y="135" fill="#8b5cf6" class="wp-layer-label" text-anchor="middle">OnResponse</text><rect width="74" height="32" x="508" y="168" fill="#334155" stroke="#f59e0b" stroke-width="1" rx="4"/><text x="545" y="186" fill="#e2e8f0" class="wp-feature" text-anchor="middle">logging</text><text x="545" y="218" fill="#94a3b8" class="wp-feature" text-anchor="middle">500 → 503</text><text x="545" y="233" fill="#94a3b8" class="wp-feature" text-anchor="middle">Add headers</text><line x1="370" x2="390" y1="200" y2="200" stroke="#475569" stroke-width="2"/><polygon fill="#475569" points="387 196 395 200 387 204"/><line x1="480" x2="500" y1="200" y2="200" stroke="#475569" stroke-width="2"/><polygon fill="#475569" points="497 196 505 200 497 204"/><rect width="85" height="100" x="630" y="150" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="10"/><rect width="85" height="26" x="630" y="150" fill="url(#wp-greenGrad)" rx="10"/><rect width="85" height="8" x="630" y="168" fill="url(#wp-greenGrad)"/><text x="672" y="169" fill="#fff" class="wp-label" font-size="10" text-anchor="middle">Worker</text><text x="672" y="195" class="wp-feature" text-anchor="middle">vLLM / SGLang</text><text x="672" y="212" class="wp-feature" text-anchor="middle">LLM Inference</text><text x="672" y="229" class="wp-feature" text-anchor="middle">KV Cache</text><g class="wp-pulse"><rect width="105" height="100" x="775" y="150" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="10"/><rect width="105" height="26" x="775" y="150" fill="url(#wp-amberGrad)" rx="10"/><rect width="105" height="8" x="775" y="168" fill="url(#wp-amberGrad)"/><text x="827" y="169" fill="#1e293b" class="wp-label" font-size="11" text-anchor="middle">Response</text><text x="827" y="195" class="wp-feature" text-anchor="middle">200 OK</text><text x="827" y="212" class="wp-feature" text-anchor="middle">x-request-id: abc</text><text x="827" y="229" class="wp-feature" text-anchor="middle">{&quot;choices&quot;: [...]}</text></g><g clip-path="url(#wp-clipFlow1)"><circle cx="130" cy="200" r="4" fill="#818cf8" class="wp-packet1" filter="url(#wp-glow)"/><circle cx="130" cy="200" r="4" fill="#a78bfa" class="wp-packet2" filter="url(#wp-glow)"/></g><g clip-path="url(#wp-clipFlow2)"><circle cx="620" cy="200" r="4" fill="#34d399" class="wp-packet1" filter="url(#wp-glow)"/></g><g clip-path="url(#wp-clipFlow3)"><circle cx="735" cy="200" r="4" fill="#fbbf24" class="wp-packet1" filter="url(#wp-glow)"/></g><line x1="125" x2="170" y1="200" y2="200" stroke="#6366f1" stroke-width="2"/><polygon fill="#6366f1" points="167 196 175 200 167 204"/><line x1="605" x2="630" y1="200" y2="200" stroke="#475569" stroke-width="2"/><polygon fill="#475569" points="627 196 635 200 627 204"/><line x1="715" x2="775" y1="200" y2="200" stroke="#f59e0b" stroke-width="2"/><polygon fill="#f59e0b" points="772 196 780 200 772 204"/><g class="wp-reject-pulse"><path fill="none" stroke="#ef4444" stroke-dasharray="5 3" stroke-width="2" d="M 270 310 L 270 350 L 72 350 L 72 260"/><polygon fill="#ef4444" points="68 265 72 255 76 265"/><rect width="90" height="24" x="225" y="335" fill="#1e293b" stroke="#ef4444" stroke-width="1" rx="4"/><text x="270" y="351" fill="#f87171" class="wp-action-label" text-anchor="middle">401 / 429 Reject</text></g><rect width="280" height="120" x="20" y="380" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="160" y="402" fill="#64748b" class="wp-layer-label" text-anchor="middle">Plugin Actions</text><rect width="12" height="12" x="35" y="415" fill="#10b981" rx="2"/><text x="55" y="425" fill="#e2e8f0" class="wp-sublabel" font-size="10">Continue</text><text x="140" y="425" fill="#94a3b8" class="wp-feature">Pass to next plugin</text><rect width="12" height="12" x="35" y="440" fill="#ef4444" rx="2"/><text x="55" y="450" fill="#e2e8f0" class="wp-sublabel" font-size="10">Reject(status)</text><text x="140" y="450" fill="#94a3b8" class="wp-feature">Return error immediately</text><rect width="12" height="12" x="35" y="465" fill="#0ea5e9" rx="2"/><text x="55" y="475" fill="#e2e8f0" class="wp-sublabel" font-size="10">Modify(changes)</text><text x="140" y="475" fill="#94a3b8" class="wp-feature">Transform request/response</text><rect width="280" height="120" x="320" y="380" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="460" y="402" fill="#64748b" class="wp-layer-label" text-anchor="middle">Enterprise Features</text><circle cx="338" cy="420" r="4" fill="#8b5cf6"/><text x="350" y="424" fill="#e2e8f0" class="wp-feature">Sandboxed WASM runtime (no host access)</text><circle cx="338" cy="442" r="4" fill="#10b981"/><text x="350" y="446" fill="#e2e8f0" class="wp-feature">Dynamic hot-reload via REST API</text><circle cx="338" cy="464" r="4" fill="#0ea5e9"/><text x="350" y="468" fill="#e2e8f0" class="wp-feature">LRU cache for compiled modules</text><circle cx="338" cy="486" r="4" fill="#f59e0b"/><text x="350" y="490" fill="#e2e8f0" class="wp-feature">Resource limits (memory, CPU, timeout)</text><rect width="260" height="120" x="620" y="380" fill="#1e293b" stroke="#10b981" stroke-width="1" rx="10"/><text x="750" y="402" fill="#10b981" class="wp-layer-label" text-anchor="middle">Performance</text><text x="635" y="425" fill="#94a3b8" class="wp-feature">Cache Hit Execution:</text><text x="865" y="425" fill="#34d399" class="wp-sublabel" font-size="11" text-anchor="end">&lt;1ms</text><text x="635" y="447" fill="#94a3b8" class="wp-feature">First Load (compile):</text><text x="865" y="447" fill="#fbbf24" class="wp-sublabel" font-size="11" text-anchor="end">10-50ms</text><text x="635" y="469" fill="#94a3b8" class="wp-feature">Simple Plugin (auth):</text><text x="865" y="469" fill="#34d399" class="wp-sublabel" font-size="11" text-anchor="end">0.1-0.3ms</text><text x="635" y="491" fill="#94a3b8" class="wp-feature">Complex Plugin (transform):</text><text x="865" y="491" fill="#38bdf8" class="wp-sublabel" font-size="11" text-anchor="end">0.5-2ms</text><text x="450" y="510" fill="#64748b" class="wp-sublabel" font-size="11" text-anchor="middle">WebAssembly Component Model • Rust / Go / C / Any Language • Zero Gateway Restarts</text></svg>