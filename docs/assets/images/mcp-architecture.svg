ature">Deny destructive ops</text><rect width="10" height="10" x="35" y="418" fill="#ef4444" rx="2"/><text x="52" y="427" fill="#e2e8f0" class="mcp-sublabel" font-size="9">Sandboxed</text><text x="105" y="427" fill="#94a3b8" class="mcp-feature">Read-only, no network</text><rect width="210" height="130" x="250" y="320" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" rx="10"/><text x="355" y="342" fill="#0ea5e9" class="mcp-layer-label" text-anchor="middle">Response Transformation</text><text x="265" y="365" fill="#38bdf8" class="mcp-code">passthrough</text><text x="350" y="365" fill="#94a3b8" class="mcp-feature">→ mcp_call (raw)</text><text x="265" y="385" fill="#38bdf8" class="mcp-code">web_search_call</text><text x="370" y="385" fill="#94a3b8" class="mcp-feature">→ OpenAI format</text><text x="265" y="405" fill="#38bdf8" class="mcp-code">file_search_call</text><text x="370" y="405" fill="#94a3b8" class="mcp-feature">→ OpenAI format</text><text x="265" y="425" fill="#38bdf8" class="mcp-code">code_interpreter</text><text x="370" y="425" fill="#94a3b8" class="mcp-feature">→ OpenAI format</text><rect width="180" height="130" x="480" y="320" fill="#1e293b" stroke="#14b8a6" stroke-width="1" rx="10"/><text x="570" y="342" fill="#14b8a6" class="mcp-layer-label" text-anchor="middle">Transport Types</text><circle cx="498" cy="358" r="4" fill="#10b981"/><text x="510" y="362" fill="#e2e8f0" class="mcp-sublabel" font-size="9">stdio</text><text x="495" y="374" fill="#94a3b8" class="mcp-feature">Local processes (npx, python)</text><circle cx="498" cy="392" r="4" fill="#0ea5e9"/><text x="510" y="396" fill="#e2e8f0" class="mcp-sublabel" font-size="9">SSE</text><text x="495" y="408" fill="#94a3b8" class="mcp-feature">Server-Sent Events (remote)</text><circle cx="498" cy="426" r="4" fill="#f59e0b"/><text x="510" y="430" fill="#e2e8f0" class="mcp-sublabel" font-size="9">streamable</text><text x="495" y="442" fill="#94a3b8" class="mcp-feature">Bidirectional HTTP streaming</text><rect width="200" height="130" x="680" y="320" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" rx="10"/><text x="780" y="342" fill="#8b5cf6" class="mcp-layer-label" text-anchor="middle">Enterprise Features</text><circle cx="698" cy="362" r="4" fill="#8b5cf6"/><text x="710" y="366" fill="#e2e8f0" class="mcp-feature">Multi-tenant isolation</text><circle cx="698" cy="382" r="4" fill="#10b981"/><text x="710" y="386" fill="#e2e8f0" class="mcp-feature">Audit logging for compliance</text><circle cx="698" cy="402" r="4" fill="#0ea5e9"/><text x="710" y="406" fill="#e2e8f0" class="mcp-feature">Per-tool policy rules</text><circle cx="698" cy="422" r="4" fill="#f59e0b"/><text x="710" y="426" fill="#e2e8f0" class="mcp-feature">Credential isolation</text><circle cx="698" cy="442" r="4" fill="#ef4444"/><text x="710" y="446" fill="#e2e8f0" class="mcp-feature">Proxy support (HTTP/HTTPS)</text><text x="450" y="485" fill="#64748b" class="mcp-sublabel" font-size="11" text-anchor="middle">Models Never See Credentials • All Tool Calls Logged • Qualified Names Prevent Collisions</text><rect width="90" height="70" x="790" y="200" fill="#1e293b" stroke="#475569" stroke-width="1" rx="6"/><text x="835" y="220" fill="#64748b" class="mcp-layer-label" text-anchor="middle">External</text><text x="835" y="238" fill="#94a3b8" class="mcp-feature" text-anchor="middle">Web APIs</text><text x="835" y="253" fill="#94a3b8" class="mcp-feature" text-anchor="middle">Databases</text><text x="835" y="268" fill="#94a3b8" class="mcp-feature" text-anchor="middle">File Systems</text><line x1="770" x2="790" y1="130" y2="130" stroke="#475569" stroke-width="1"/><line x1="790" x2="790" y1="130" y2="200" stroke="#475569" stroke-width="1"/><line x1="770" x2="790" y1="230" y2="230" stroke="#475569" stroke-width="1"/><line x1="790" x2="790" y1="230" y2="270" stroke="#475569" stroke-width="1"/></svg>