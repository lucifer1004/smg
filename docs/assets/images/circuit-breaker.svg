<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340"><defs><linearGradient id="cb-greenGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#10b981" offset="0%"/><stop style="stop-color:#34d399" offset="100%"/></linearGradient><linearGradient id="cb-redGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#ef4444" offset="0%"/><stop style="stop-color:#f87171" offset="100%"/></linearGradient><linearGradient id="cb-amberGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#f59e0b" offset="0%"/><stop style="stop-color:#fbbf24" offset="100%"/></linearGradient><linearGradient id="cb-bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop style="stop-color:#0f172a" offset="0%"/><stop style="stop-color:#1e293b" offset="100%"/></linearGradient><filter id="cb-glow"><feGaussianBlur result="coloredBlur" stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="cb-softGlow"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="cb-arrowGreen" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#34d399" d="M0,0 L0,6 L9,3 z"/></marker><marker id="cb-arrowRed" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#f87171" d="M0,0 L0,6 L9,3 z"/></marker><marker id="cb-arrowAmber" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#fbbf24" d="M0,0 L0,6 L9,3 z"/></marker><pattern id="cb-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-width=".5" d="M 40 0 L 0 0 0 40" opacity=".3"/></pattern></defs><style>@keyframes cb-pulse{0%{opacity:1}50%{opacity:.7}}@keyframes cb-flowGreen{0%{stroke-dashoffset:20}}@keyframes cb-flowRed{0%{stroke-dashoffset:20}}.cb-label{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-weight:600}.cb-sublabel{font-weight:500}.cb-feature,.cb-state-desc,.cb-sublabel,.cb-transition-label{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.cb-feature{font-size:10px;fill:#94a3b8}.cb-state-desc,.cb-transition-label{font-size:9px}.cb-transition-label{fill:#cbd5e1;font-weight:500}.cb-state-desc{fill:#64748b}.cb-pulse-green{animation:cb-pulse 2s ease-in-out infinite}</style><rect width="800" height="340" fill="url(#cb-bgGrad)" rx="16"/><rect width="800" height="340" fill="url(#cb-grid)" rx="16"/><ellipse cx="150" cy="170" fill="#10b981" filter="url(#cb-softGlow)" opacity=".1" rx="90" ry="90"/><ellipse cx="650" cy="170" fill="#ef4444" filter="url(#cb-softGlow)" opacity=".1" rx="90" ry="90"/><ellipse cx="400" cy="170" fill="#f59e0b" filter="url(#cb-softGlow)" opacity=".1" rx="80" ry="80"/><path fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#cb-arrowRed)" d="M 230 140 Q 350 60 520 140"/><rect width="140" height="28" x="330" y="70" fill="#1e293b" stroke="#334155" rx="4"/><text x="400" y="88" class="cb-transition-label" text-anchor="middle">Failures ≥ Threshold</text><path fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#cb-arrowAmber)" d="M 570 220 Q 500 280 430 220"/><rect width="110" height="28" x="450" y="260" fill="#1e293b" stroke="#334155" rx="4"/><text x="505" y="278" class="cb-transition-label" text-anchor="middle">Timeout Expires</text><path fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#cb-arrowGreen)" d="M 350 140 Q 280 80 230 140"/><rect width="125" height="28" x="225" y="60" fill="#1e293b" stroke="#334155" rx="4"/><text x="287" y="78" class="cb-transition-label" text-anchor="middle">Success ≥ Threshold</text><path fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#cb-arrowRed)" d="M 450 200 Q 500 240 550 200"/><rect width="90" height="24" x="455" y="222" fill="#1e293b" stroke="#334155" rx="4"/><text x="500" y="238" class="cb-transition-label" text-anchor="middle">Any Failure</text><g class="cb-pulse-green"><circle cx="150" cy="170" r="75" fill="#1e293b" stroke="#10b981" stroke-width="3" filter="url(#cb-glow)"/><circle cx="150" cy="170" r="65" fill="url(#cb-greenGrad)" opacity=".15"/><text x="150" y="155" fill="#34d399" class="cb-label" font-size="16" text-anchor="middle">CLOSED</text><text x="150" y="175" class="cb-state-desc" text-anchor="middle">Normal Operation</text><text x="150" y="190" class="cb-state-desc" text-anchor="middle">Requests Flow</text><text x="150" y="205" class="cb-state-desc" text-anchor="middle">Failures Counted</text></g><g><circle cx="400" cy="170" r="65" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><circle cx="400" cy="170" r="55" fill="url(#cb-amberGrad)" opacity=".15"/><text x="400" y="155" fill="#fbbf24" class="cb-label" font-size="14" text-anchor="middle">HALF-OPEN</text><text x="400" y="175" class="cb-state-desc" text-anchor="middle">Probe Mode</text><text x="400" y="190" class="cb-state-desc" text-anchor="middle">Limited Requests</text><text x="400" y="205" class="cb-state-desc" text-anchor="middle">Testing Recovery</text></g><g><circle cx="650" cy="170" r="75" fill="#1e293b" stroke="#ef4444" stroke-width="3"/><circle cx="650" cy="170" r="65" fill="url(#cb-redGrad)" opacity=".15"/><text x="650" y="155" fill="#f87171" class="cb-label" font-size="16" text-anchor="middle">OPEN</text><text x="650" y="175" class="cb-state-desc" text-anchor="middle">Circuit Tripped</text><text x="650" y="190" class="cb-state-desc" text-anchor="middle">Requests Rejected</text><text x="650" y="205" class="cb-state-desc" text-anchor="middle">Worker Isolated</text></g><rect width="180" height="45" x="25" y="280" fill="#1e293b" stroke="#334155" rx="8"/><circle cx="45" cy="295" r="6" fill="#34d399"/><text x="60" y="299" fill="#e2e8f0" class="cb-feature">Success resets counter</text><circle cx="45" cy="315" r="6" fill="#f87171"/><text x="60" y="319" fill="#e2e8f0" class="cb-feature">Failure increments counter</text><rect width="180" height="45" x="595" y="280" fill="#1e293b" stroke="#334155" rx="8"/><text x="685" y="298" fill="#94a3b8" class="cb-feature" text-anchor="middle">Default Thresholds</text><text x="685" y="315" fill="#e2e8f0" class="cb-feature" text-anchor="middle">Failures: 10 | Timeout: 60s</text><text x="400" y="330" fill="#64748b" class="cb-sublabel" font-size="11" text-anchor="middle">Automatic Fault Isolation • Graceful Recovery • Cascade Prevention</text></svg>