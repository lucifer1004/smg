<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260"><defs><linearGradient id="cbr-primaryGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#6366f1"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient><linearGradient id="cbr-blueGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#0ea5e9"/><stop offset="100%" style="stop-color:#38bdf8"/></linearGradient><linearGradient id="cbr-greenGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#10b981"/><stop offset="100%" style="stop-color:#34d399"/></linearGradient><linearGradient id="cbr-amberGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f59e0b"/><stop offset="100%" style="stop-color:#fbbf24"/></linearGradient><linearGradient id="cbr-bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#0f172a"/><stop offset="100%" style="stop-color:#1e293b"/></linearGradient><pattern id="cbr-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-width=".5" d="M 40 0 L 0 0 0 40" opacity=".3"/></pattern></defs><style>.cbr-label{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-weight:600}.cbr-sublabel{font-weight:500}.cbr-msg,.cbr-note,.cbr-sublabel{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.cbr-msg{font-size:9px;font-weight:500}.cbr-note{font-size:8px}</style><rect width="600" height="260" fill="url(#cbr-bgGrad)" rx="16"/><rect width="600" height="260" fill="url(#cbr-grid)" rx="16"/><text x="300" y="25" fill="#e2e8f0" class="cbr-label" font-size="13" text-anchor="middle">Recovery — Circuit Half-Open → Closed</text><rect width="80" height="26" x="60" y="38" fill="url(#cbr-blueGrad)" rx="8"/><text x="100" y="55" fill="#fff" class="cbr-label" font-size="10" text-anchor="middle">Client</text><rect width="80" height="26" x="240" y="38" fill="url(#cbr-primaryGrad)" rx="8"/><text x="280" y="55" fill="#fff" class="cbr-label" font-size="10" text-anchor="middle">SMG</text><rect width="80" height="26" x="430" y="38" fill="url(#cbr-greenGrad)" rx="8"/><text x="470" y="55" fill="#fff" class="cbr-label" font-size="10" text-anchor="middle">Worker</text><line x1="100" x2="100" y1="64" y2="235" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5" opacity=".4"/><line x1="280" x2="280" y1="64" y2="235" stroke="#8b5cf6" stroke-dasharray="4 4" stroke-width="1.5" opacity=".4"/><line x1="470" x2="470" y1="64" y2="235" stroke="#34d399" stroke-dasharray="4 4" stroke-width="1.5" opacity=".4"/><rect width="115" height="16" x="415" y="70" fill="#ef4444" stroke="#ef4444" stroke-width="1" opacity=".2" rx="4"/><text x="472" y="82" fill="#f87171" class="cbr-note" text-anchor="middle">Open (30s elapsed)</text><rect width="100" height="16" x="420" y="90" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" opacity=".2" rx="4"/><text x="470" y="102" fill="#fbbf24" class="cbr-note" font-weight="600" text-anchor="middle">Circuit: Half-Open</text><line x1="100" x2="275" y1="120" y2="120" stroke="#38bdf8" stroke-width="1.5"/><polygon fill="#38bdf8" points="272 116 280 120 272 124"/><text x="188" y="115" fill="#38bdf8" class="cbr-msg" text-anchor="middle">Request 1</text><line x1="280" x2="465" y1="132" y2="132" stroke="#f59e0b" stroke-width="1.5"/><polygon fill="#f59e0b" points="462 128 470 132 462 136"/><text x="373" y="128" fill="#fbbf24" class="cbr-msg" text-anchor="middle">Test request</text><line x1="470" x2="285" y1="146" y2="146" stroke="#34d399" stroke-dasharray="5 3" stroke-width="1.5"/><polygon fill="#34d399" points="288 142 280 146 288 150"/><text x="373" y="143" fill="#34d399" class="cbr-msg" text-anchor="middle">Success!</text><line x1="280" x2="105" y1="158" y2="158" stroke="#a78bfa" stroke-dasharray="5 3" stroke-width="1.5"/><polygon fill="#a78bfa" points="108 154 100 158 108 162"/><text x="188" y="155" fill="#a78bfa" class="cbr-msg" text-anchor="middle">Response</text><line x1="100" x2="275" y1="176" y2="176" stroke="#38bdf8" stroke-width="1.5"/><polygon fill="#38bdf8" points="272 172 280 176 272 180"/><text x="188" y="171" fill="#38bdf8" class="cbr-msg" text-anchor="middle">Request 2</text><line x1="280" x2="465" y1="188" y2="188" stroke="#f59e0b" stroke-width="1.5"/><polygon fill="#f59e0b" points="462 184 470 188 462 192"/><text x="373" y="184" fill="#fbbf24" class="cbr-msg" text-anchor="middle">Test request</text><line x1="470" x2="285" y1="200" y2="200" stroke="#34d399" stroke-dasharray="5 3" stroke-width="1.5"/><polygon fill="#34d399" points="288 196 280 200 288 204"/><text x="373" y="197" fill="#34d399" class="cbr-msg" text-anchor="middle">Success! (threshold met)</text><rect width="95" height="18" x="425" y="206" fill="#10b981" stroke="#10b981" stroke-width="1.5" opacity=".3" rx="4"/><text x="472" y="219" fill="#34d399" class="cbr-note" font-weight="700" text-anchor="middle">Circuit: CLOSED</text><line x1="280" x2="105" y1="218" y2="218" stroke="#a78bfa" stroke-dasharray="5 3" stroke-width="1.5"/><polygon fill="#a78bfa" points="108 214 100 218 108 222"/><text x="188" y="215" fill="#a78bfa" class="cbr-msg" text-anchor="middle">Response</text><text x="300" y="250" fill="#64748b" class="cbr-sublabel" font-size="10" text-anchor="middle">Gradual recovery with test requests before fully closing the circuit</text></svg>